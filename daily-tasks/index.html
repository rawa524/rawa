<!doctype html>
<html lang="ckb" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ڕۆژانە — ئەرکەکانم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#24352f;font:17px/1.8 system-ui,sans-serif}main{max-width:780px;margin:65px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{color:#55776a;font-weight:700}h1{font-size:38px;margin:10px 0}p{color:#69796f}.badge{background:#e3ece5;border-radius:16px;padding:12px 20px;white-space:nowrap}.panel{background:white;padding:25px;border:1px solid #e0e5dc;border-radius:22px;margin-top:24px;box-shadow:0 12px 40px #25362f06}label{display:block;font-size:14px;margin-bottom:5px}input,button{font:inherit;border-radius:10px;padding:11px 14px}input{border:1px solid #cbd5cd;width:100%;background:#fafbf8}input:focus,button:focus-visible{outline:3px solid #94bea6;outline-offset:2px}.fields{display:grid;grid-template-columns:1fr 170px;gap:14px}button{border:0;cursor:pointer;background:#285943;color:white}form>button{margin-top:16px;width:100%}nav{display:flex;gap:8px;margin:25px 0 15px;flex-wrap:wrap}nav button{background:transparent;color:#596b60;font-size:14px}nav button[aria-pressed=true]{background:#dce9df;color:#204d36}ul{list-style:none;padding:0;margin:0}.task{display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:1px solid #eef0ea}.task:last-child{border:0}.task input{width:22px;height:22px;accent-color:#285943;flex-shrink:0}.content{flex:1;min-width:0}.title{overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#87948b}.date{font-size:13px;color:#79877d}.overdue{color:#b04b3b}.delete{background:transparent;color:#98675e;font-size:14px;padding:8px}.empty{text-align:center;padding:35px 10px;color:#78877d}footer{font-size:13px;text-align:center;color:#7c897f;margin-top:24px}#message{color:#a04436;font-size:14px} @media(max-width:540px){main{margin:20px auto;padding:18px}h1{font-size:29px}header{align-items:start}.badge{font-size:13px;padding:8px}.fields{grid-template-columns:1fr}.panel{padding:18px}}
</style>
<main>
<header><div><span class="brand">☀ ڕۆژانە</span><h1>هەنگاوێک بۆ ڕۆژێکی باشتر</h1><p>ئەرکەکانت ڕێک بخە، بە ئارامی تەواویان بکە.</p></div><span class="badge" id="count" aria-live="polite"></span></header>
<section class="panel" aria-label="زیادکردنی ئەرک"><form id="form"><div class="fields"><div><label for="title">چی دەبێت بکەیت؟</label><input id="title" placeholder="بۆ نموونە: خوێندنەوەی ١٠ لاپەڕە" required maxlength="240" autocomplete="off"></div><div><label for="date">بەروار (ئارەزوومەندانە)</label><input id="date" type="date"></div></div><button type="submit">＋ زیادکردنی ئەرک</button></form><div id="message" role="status"></div></section>
<nav aria-label="پاڵاوتنی ئەرکەکان"><button data-filter="all" aria-pressed="true">هەموو</button><button data-filter="active" aria-pressed="false">ماوەکان</button><button data-filter="done" aria-pressed="false">تەواوکراوەکان</button></nav>
<section class="panel" style="margin-top:0" aria-label="لیستی ئەرکەکان"><ul id="tasks"></ul><div id="empty" class="empty"></div></section>
<footer>ئەرکەکان تەنها لەم وێبگەڕەدا پاشەکەوت دەبن؛ بە سڕینەوەی داتای وێبگەڕ دەسڕدرێنەوە.</footer>
</main>
<script>
'use strict';
const key='rozhana.tasks.v1';
const list=document.querySelector('#tasks'), empty=document.querySelector('#empty'), message=document.querySelector('#message');
let tasks=[],filter='all';
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saved))throw Error();tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.done==='boolean'&&typeof t.date==='string');}catch{message.textContent='داتای پاشەکەوتکراو نەخوێندرایەوە. تکایە ڕێکخستنەکانی وێبگەڕ بپشکنە.';}
function persist(next){try{localStorage.setItem(key,JSON.stringify(next));tasks=next;message.textContent='';render();return true;}catch{message.textContent='پاشەکەوتکردن سەرکەوتوو نەبوو. تکایە ڕێگە بە پاشەکەوتکردنی داتا بدە.';return false;}}
function render(){list.replaceChildren();const remaining=tasks.filter(t=>!t.done).length;document.querySelector('#count').textContent=`${remaining.toLocaleString('ar-IQ')} ئەرک ماوە`;
const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));empty.hidden=visible.length>0;empty.textContent=tasks.length===0?'هێشتا ئەرکێکت نییە. یەکەم ئەرکت زیاد بکە 🌱':'هیچ ئەرکێک لەم بەشەدا نییە.';
const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
for(const task of visible){const row=document.createElement('li');row.className='task'+(task.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.setAttribute('aria-label',`تەواوکردنی ${task.title}`);check.onchange=()=>{if(!persist(tasks.map(t=>t.id===task.id?{...t,done:check.checked}:t)))check.checked=task.done;};const content=document.createElement('div');content.className='content';const title=document.createElement('div');title.className='title';title.textContent=task.title;content.append(title);if(task.date){const date=document.createElement('div');date.className='date'+(!task.done&&task.date<today?' overdue':'');date.textContent=task.date+(!task.done&&task.date<today?' · کاتەکەی تێپەڕیوە':'');content.append(date);}const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.textContent='سڕینەوە';remove.setAttribute('aria-label',`سڕینەوەی ${task.title}`);remove.onclick=()=>{if(confirm('ئەم ئەرکە بسڕدرێتەوە؟'))persist(tasks.filter(t=>t.id!==task.id));};row.append(check,content,remove);list.append(row);}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#title'),date=document.querySelector('#date');const value=title.value.trim();if(!value){title.setCustomValidity('تکایە ناوی ئەرکەکە بنووسە.');title.reportValidity();return;}if(persist([...tasks,{id:crypto.randomUUID(),title:value,date:date.value,done:false}])){e.target.reset();title.focus();}};
document.querySelector('#title').oninput=e=>e.target.setCustomValidity('');
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();});
window.addEventListener('storage',e=>{if(e.key===key)location.reload();});render();
</script>
</html>
